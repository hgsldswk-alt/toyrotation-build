name: ToyRotation
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.toyrotation
    APP_STORE_ID: "6837843069"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  ToyRotation:
    type: application
    platform: iOS
    sources: [ToyRotation, Shared]
    dependencies:
      - target: ToyRotationWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ToyRotation AppStore
    entitlements:
      path: ToyRotation/ToyRotation.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.toyrotation]
    info:
      path: ToyRotation/Info.plist
      properties:
        CFBundleDisplayName: Toy Rotation
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        ToyRotationProProductID: $(APP_ID).pro
        ToyRotationTrialProductID: $(APP_ID).trial
        NSCameraUsageDescription: Take one photo of each toy bin so you can see what's inside at a glance.
  ToyRotationWidget:
    type: app-extension
    platform: iOS
    sources:
      - ToyRotationWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hgsldswk.toyrotation.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ToyRotation Widget AppStore
    entitlements:
      path: ToyRotationWidget/ToyRotationWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.toyrotation]
    info:
      path: ToyRotationWidget/Info.plist
      properties:
        CFBundleDisplayName: Toy Rotation
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ToyRotationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ToyRotationTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  ToyRotationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ToyRotationUITests]
    dependencies:
      - target: ToyRotation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ToyRotation
schemes:
  ToyRotation:
    build:
      targets:
        ToyRotation: all
        ToyRotationTests: [test]
    test:
      config: Debug
      targets: [ToyRotationTests]
  ToyRotationUI:
    build:
      targets:
        ToyRotation: all
        ToyRotationUITests: [test]
    test:
      config: Debug
      targets: [ToyRotationUITests]
